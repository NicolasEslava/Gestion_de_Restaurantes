<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Gestión de Restaurantes</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                <img src="/imagenes/logo.png" alt="Logo Gestión de Restaurantes">
            </div>

            <div class="login-header">
                <h1>Gestión de Restaurantes</h1>
                <p>Inicia sesión para continuar</p>
            </div>

            <form id="login-form">

                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario"
                        autocomplete="username" required>

                </div>


                <div class="input-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña"
                        autocomplete="current-password" required>

                </div>


                <button type="submit" id="login-button">
                    Iniciar sesión
                </button>


                <p id="login-message"></p>

            </form>


            <div class="login-footer">
                <span>Sistema de Gestión de Restaurantes</span>
            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
